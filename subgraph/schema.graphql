type Account @entity(immutable: false) {
  id: Bytes!
  "Neto recibido en la wallet del negocio (suma de PaymentSettled.net)."
  totalReceived: BigInt!
  totalFees: BigInt!
  totalNetworkFees: BigInt!
  paymentCount: Int!
  payments: [Payment!]! @derivedFrom(field: "merchant")
}

type Payment @entity(immutable: false) {
  id: Bytes!
  nonce: Bytes!
  token: Bytes!
  merchant: Account!
  payer: Bytes!
  "Lo que firmó el agente: net + fee + networkFee."
  gross: BigInt!
  net: BigInt!
  fee: BigInt!
  networkFee: BigInt!
  "Repartido por el Safe con settleStray (la autorización se usó fuera de Peaje)."
  stray: Boolean!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}
