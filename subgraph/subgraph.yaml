specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PeajeSettlement
    network: arbitrum-sepolia
    source:
      address: "0x36F9aEBeBce767A1FEE25Fa90F9bF13137E61231"
      abi: PeajeSettlement
      startBlock: 313383460
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Payment
        - Withdrawal
        - Account
      abis:
        - name: PeajeSettlement
          file: ./abis/PeajeSettlement.json
      eventHandlers:
        - event: PaymentSettled(indexed bytes32,indexed address,indexed address,address,uint256,uint256,uint256)
          handler: handlePaymentSettled
        - event: Withdrawn(indexed address,indexed address,indexed address,uint256)
          handler: handleWithdrawn
      file: ./src/mapping.ts
