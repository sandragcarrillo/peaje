packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - esbuild

# mppx se publica varias veces al día (SDK nuevo). Excluido del guard de edad mínima.
minimumReleaseAgeExclude:
  - mppx

allowBuilds:
  '@reown/appkit': true
  bufferutil: true
  esbuild: true
  keccak: true
  utf-8-validate: true

patchedDependencies:
  mppx@0.8.19: patches/mppx@0.8.19.patch
